[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "its-trusted-fl"
version = "1.2.0"
description = "智慧交通可信任聯邦式學習實驗（高公局 VD 車速預測 + DP-SGD）"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "flwr[simulation]>=1.26.0,<1.27",
    "torch>=2.2",
    "opacus>=1.5.4",
    "numpy",
    "pandas>=2.0",
    "matplotlib",
    "psutil",  # scripts/edge_footprint.py 量記憶體
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = [
    "task", "data", "privacy", "results_log", "vd_parse", "vd_preprocess",
    "client_app", "server_app", "security", "guard",
]

[tool.flwr.app]
publisher = "my-univ-lab"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

# 執行設定：可用 flwr run . --run-config "key=value ..." 覆寫。
# data-dir / results-dir 請用絕對路徑（flwr run 會把 app 安裝到別處執行）；
# scripts/run_experiments.sh 會自動帶入。
[tool.flwr.app.config]
num-server-rounds = 20
num-clients = 8            # 必須等於 Flower 設定檔的 options.num-supernodes 與 manifest 的 VD 數
local-epochs = 1
batch-size = 64
learning-rate = 0.2        # 真實資料 3 seed 調參：殘差模型下 DP 最佳約 0.2～0.3（見 README）
lookback = 12              # 過去 12 筆 5 分鐘車速 → 預測下一筆
horizon = 1                # 預測幾步後：1 = 5 分鐘後、3 = 15 分鐘後、6 = 30 分鐘後
hidden-size = 32
loss = "mse"               # 訓練損失：mse / huber / l1（評估一律用 MAE、RMSE）
calendar = "tod"           # 日曆特徵：""（無）、"tod"（目標時間點的時段 sin/cos，預設；5 seed 微調後 DP 2.665→2.642）、"tod,dow"（再加週末旗標）
lag-day = false            # true = 加入「昨天同一時刻」的車速當輸入（同一 VD 的歷史值）
residual = true            # true = 預測相對最後一筆的變化量（輸出 = 最後一筆 + MLP），false = 直接預測車速
train-frac = 0.8
use-dp = true              # false = 無 DP 對照組
noise-multiplier = 1.1
max-grad-norm = 1.0
target-delta = 1e-5
finetune-epochs = 3        # > 0：最後一輪各 VD 拿全域模型在本地再訓練幾個 epoch（個人化，只在本地用），回報 ft_mae_kmh
finetune-lr = 0.05         # 個人化微調的學習率（比聯邦訓練小，避免把全域模型學到的東西洗掉）
client-dp-noise = 0.0      # > 0 啟用 client-level DP（伺服器端裁剪＋加噪，保護整個 VD）；0 = 關閉
client-fraction = 1.0       # 每輪參與訓練的 client 比例（< 1 時 client-level ε 有取樣放大；評估仍用全部 client）
client-dp-adaptive = false  # true = client-level DP 用自適應裁剪（client-dp-clip 為初始值）
nodp-grad-clip = 0.0       # 無 DP 時的整批梯度範數裁剪（0 = 不裁剪；只穩定訓練，沒有隱私保證）
client-dp-clip = 0.1       # client-level DP 的更新量裁剪上限（更新量 L2 範數中位數約 0.24）
# 通訊安全與攻擊模擬（對應課程講義「物聯網安全」；見 README「依課程講義補強」）
verify-updates = true      # VD 上傳的更新附 HMAC-SHA256，伺服器驗不過就不聚合（完整性、鑑別性、防重送）
update-auth = "hmac"       # hmac：共用金鑰的訊息鑑別碼；ed25519：VD 數位簽章，伺服器只有公鑰（加上不可否認性）
sign-models = true         # 伺服器用 Ed25519 簽全域模型，VD 驗證通過才使用（防假更新）
key-dir = "keys"           # 金鑰資料夾：vd-<編號>.key（各 VD 一把隨機金鑰）、server.pub；server/ 只給伺服器（不進 git）
aggregator = "fedavg"      # fedavg／median（中位數）／trimmed（截尾平均）：後兩者可抵抗被入侵的 VD
attack-clients = 0         # > 0：最後幾個 VD 被入侵，送出惡意更新（仍有合法金鑰）
attack-type = "flip"       # flip（反向並放大自己的更新）／noise（大幅隨機雜訊）／collude（串通、小幅同向偏移）
attack-scale = 10.0        # 惡意更新的放大倍數
tamper-rate = 0.0          # 模擬網路中間人：每個上傳更新被竄改的機率
collusion-filter = false   # true = 跨輪偵測串通：更新方向一直和別人特別像的 VD 被剔除
secure-agg = false         # true = 安全聚合（成對遮罩）：伺服器只看得到所有 VD 的加總（只能配 fedavg、全部參與）
upload-bits = 32           # < 32：上傳前把更新量量化成幾位元（8、4、2；隨機捨入），模擬 LPWAN 的小頻寬
dropout-rate = 0.0         # 模擬 VD 斷線：每個 VD 每輪不回應的機率（可用性）
seed = 42
data-dir = "data/processed"
results-dir = "results"
run-name = ""              # 空字串 = 自動命名（dp_sigma1.1_時間 / nodp_時間）

#######################################################################
# Flower >= 1.26：num-supernodes（模擬的 client 數）不再寫在這裡，
# 而是在 Flower 設定檔（$FLWR_HOME/config.toml）的 [superlink.<name>]。
# scripts/run_experiments.sh 會把 FLWR_HOME 指到專案內 .flwr_home/
# 並依 manifest 的 VD 數自動寫入，不會動到你家目錄的設定。
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
#######################################################################

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
